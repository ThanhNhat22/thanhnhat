<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindBack</title>

    <!-- SEO -->
    <meta name="description" content="Mở bài viết trên ứng dụng FindBack">

    <!-- Open Graph (Facebook, Zalo preview) -->
    <meta property="og:title" content="FindBack">
    <meta property="og:description" content="Xem nội dung của bái chia sẻ">
    <meta property="og:image" content="https://res.cloudinary.com/ddqouziau/image/upload/v1777106420/logo_mbfiml.png">
    <meta property="og:url" content="https://metalk-a52fb.web.app">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FindBack">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FindBack">
    <meta name="twitter:description" content="Mở xem ngay">
    <meta name="twitter:image" content="https://res.cloudinary.com/ddqouziau/image/upload/v1777106420/logo_mbfiml.png">

    <!-- Android App Links -->
    <link rel="alternate" href="android-app://com.app.findback/https/metalk-a52fb.web.app">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 360px;
            width: 90%;
        }
        .logo { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #eee;
            border-top-color: #4F46E5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            display: inline-block;
            background: #4F46E5;
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>FindBack</h1>
    <div class="spinner"></div>
    <p>Đang mở ứng dụng...</p>
    <a class="btn" id="storeBtn"
       href="https://play.google.com/store/apps/details?id=com.app.findback"
       style="display:none">
        Tải ứng dụng
    </a>
</div>

<script>
    const ua = navigator.userAgent || '';
    const isFacebook = ua.includes('FBAN') || ua.includes('FBAV');
    const path = window.location.pathname;
    const host = window.location.host;
    const intentUrl = `intent://${host}${path}#Intent;scheme=https;package=com.app.findback;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.app.findback;end`;

    // Sau 2.5s hiện nút "Tải ứng dụng" nếu không mở được app
    setTimeout(() => {
        document.getElementById('storeBtn').style.display = 'inline-block';
        document.querySelector('p').textContent = 'Không mở được ứng dụng?';
        document.querySelector('.spinner').style.display = 'none';
    }, 2500);

    window.location.href = intentUrl;
</script>
</body>
</html>
